name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent-sandbox/go.mod
          cache-dependency-path: agent-sandbox/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/herdr-sandbox .
